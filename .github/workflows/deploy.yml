name: Deploy to hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create order-config.php from secrets
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          test -n "$TG_TOKEN" || { echo "Нет секрета TG_TOKEN"; exit 1; }
          php -r '$c=["tg_token"=>getenv("TG_TOKEN"),"tg_chat_id"=>getenv("TG_CHAT_ID"),"email_to"=>"intellect4gservice@gmail.com","email_from"=>"no-reply@ikazs.ru","rate_limit"=>5]; file_put_contents("3d/terminals/order-config.php","<?php\nreturn ".var_export($c,true).";\n");'

      - name: Upload via FTP
        id: ftp1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          timeout: 120000
          server-dir: ${{ secrets.FTP_DIR }}
          exclude: |
            **/.git
            **/.git/**
            **/.github/**
            scraps/**
            screenshots/**
            uploads/**
            _ds/**
            **/*.md
            **/*.docx
            **/*.xlsx
            _probe.html
            3d/terminals/order-config.example.php
            3d/terminals/README.txt
            3d/kazs40-ar/README.txt
            Бриф*.html

      - name: Пауза перед повтором
        if: steps.ftp1.outcome == 'failure'
        run: sleep 60

      - name: Upload via FTP (повтор)
        if: steps.ftp1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          timeout: 120000
          server-dir: ${{ secrets.FTP_DIR }}
          exclude: |
            **/.git
            **/.git/**
            **/.github/**
            scraps/**
            screenshots/**
            uploads/**
            _ds/**
            **/*.md
            **/*.docx
            **/*.xlsx
            _probe.html
            3d/terminals/order-config.example.php
            3d/terminals/README.txt
            3d/kazs40-ar/README.txt
            Бриф*.html
